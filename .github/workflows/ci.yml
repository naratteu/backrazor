name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MSBUILDUSESERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned SDK
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          sdk_version=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])")
          bash /tmp/dotnet-install.sh --version "$sdk_version" --install-dir "$PWD/.dotnet"
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: npm test --prefix tests
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
